<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Red Bull Rebels — Central FL Dollar Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <img src="red-bull-rebels-logo.png" class="brandLogoWide" />
  <div class="headerRight">
    <div class="projectTitle">FL Dollar Tree Reset Tracker</div>
    <div class="projectSub">Orlando · Merch Team</div>
  </div>
</header>

<main class="app">

<aside>
  <div class="panel">
    <h3>Search Store</h3>
    <input id="storeSearch" placeholder="Enter Store ID #" />
  </div>

  <div class="panel">
    <h3>Project Status</h3>

    <div class="statRow completedStat">
      <span>Completed</span>
      <div id="completedCount">0</div>
    </div>

    <div class="statRow activeStat">
      <span>Remaining</span>
      <div id="activeCount">0</div>
    </div>

    <div class="statRow closedStat">
      <span>Closed</span>
      <div id="closedCount">0</div>
    </div>

    <div class="progressBar">
      <div id="progressFill"></div>
    </div>

    <div id="progressText" class="progressLabel"></div>
  </div>

  <div class="panel">
    <h3>Updated Stores</h3>
    <div id="activityList" class="activityList"></div>
  </div>
</aside>

<div class="mapWrapper">
  <div id="map"></div>
</div>

</main>

<!-- MODAL -->
<div id="confirmModal" class="modal hidden">
  <div class="modalContent">

    <h3>Update Store Status</h3>

    <div id="confirmStoreId" class="modalStoreId"></div>

    <div class="modalAddress">
      <div id="confirmAddressLine"></div>
      <div id="confirmCityLine"></div>
    </div>

    <div class="statusButtons">
      <button id="markActive" class="btnSecondary">Mark Active</button>
      <button id="markCompleted" class="btnPrimary">Mark Completed</button>
      <button id="markClosed" class="btnDanger">Mark Closed</button>
    </div>

    <textarea id="noteBox" placeholder="Leave note..."></textarea>
    <button id="addNoteBtn" class="btnPrimary">Add Note</button>

    <div id="notesList" class="notesList"></div>

    <button id="confirmCancel" class="btnSecondary">Close</button>

  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
