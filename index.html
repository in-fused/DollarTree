<!DOCTYPE html>
<html lang="en">
<head>
  <title>Red Bull | Dollar Tree FL Resets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">RED BULL</div>
    <div class="subtitle">Florida Dollar Tree Reset Tracker</div>
  </header>

  <main>
    <aside>
      <div class="panel">
        <h3>Search Store</h3>
        <input id="storeSearch" placeholder="Enter Store #" />
      </div>

      <div class="panel">
        <h3>Status</h3>
        <div class="legend">
          <span class="dot red"></span> Not Completed<br/>
          <span class="dot green"></span> Completed
        </div>
      </div>

      <div class="panel">
        <h3>Progress</h3>
        <div id="progressText">Loading…</div>
      </div>
    </aside>

    <section id="map"></section>
  </main>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="app.js"></script>

</body>
</html>
