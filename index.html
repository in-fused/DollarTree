<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Bull Rebels — Central FL Dollar Tree Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>

  <div class="headerMain">
    <img src="red-bull-rebels-logo.png" class="brandLogoWide" />

    <div class="headerRight">
      <div class="projectTitle">Central FL Dollar Tree Project</div>
      <div class="projectSub">Orlando · Field Operations</div>
    </div>
  </div>

</header>

<main class="app">

  <aside id="sidebar">
    <div class="panel">
      <h3>Search Store</h3>
      <input id="storeSearch" placeholder="Enter Store ID #" />
    </div>

    <div class="panel">
      <h3>Progress</h3>
      <div id="progressText">0 / 0 completed</div>
      <div class="progressBar">
        <div id="progressFill"></div>
      </div>
    </div>
  </aside>

  <div class="mapWrapper">
    <div id="map"></div>
  </div>

</main>

<div id="confirmModal" class="modal hidden">
  <div class="modalContent">
    <h3 id="confirmTitle"></h3>
    <div class="modalButtons">
      <button id="confirmCancel">Cancel</button>
      <button id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
