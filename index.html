<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Bull Rebels — Central FL Dollar Tree Resets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Mapbox -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <button id="sidebarToggle" aria-label="Toggle sidebar">☰</button>

  <div class="brandLockup">
    <img
      src="/red-bull-rebels-logo.png"
      alt="Red Bull Rebels"
      class="brandLogo"
    />

    <div class="brandMeta">
      <div class="brandTitle">Red Bull Rebels</div>
      <div class="brandSubtitle">Orlando, Florida · Field Operations</div>
    </div>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="panel">
      <h3>Search Store</h3>
      <input id="storeSearch" placeholder="Enter Store #" />
    </div>

    <div class="panel">
      <h3>Progress</h3>
      <div id="progressText">Loading…</div>

      <div class="progressBar">
        <div id="progressFill"></div>
      </div>

      <!-- Momentum Ring -->
      <svg id="momentumRing" width="120" height="120" viewBox="0 0 120 120">
        <circle
          cx="60"
          cy="60"
          r="52"
          stroke="rgba(255,255,255,0.12)"
          stroke-width="10"
          fill="none"
        />
        <circle
          id="momentumProgress"
          cx="60"
          cy="60"
          r="52"
          stroke="#c8102e"
          stroke-width="10"
          fill="none"
          stroke-linecap="round"
          stroke-dasharray="326"
          stroke-dashoffset="326"
        />
      </svg>
    </div>

    <div class="panel legend">
      <span class="dot red"></span> Not Completed<br/>
      <span class="dot green"></span> Completed
    </div>
  </aside>

  <section id="map"></section>

  <!-- Locate Me -->
  <button id="locateBtn" title="Center on my location">📍</button>
</main>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal hidden">
  <div class="modalContent">
    <h3 id="confirmTitle"></h3>
    <div class="modalActions">
      <button id="confirmCancel">Cancel</button>
      <button id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
