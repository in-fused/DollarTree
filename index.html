<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Bull Rebels — Central FL Dollar Tree Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <img src="red-bull-rebels-logo.png" class="brandLogoWide" />
  <div class="headerRight">
    <div class="projectTitle">Central FL Dollar Tree Project</div>
    <div class="projectSub">Orlando · Field Operations</div>
  </div>
</header>

<main class="app">
  <aside>
    <div class="panel">
      <h3>Search Store</h3>
      <input id="storeSearch" placeholder="Enter Store ID #" />
    </div>

    <div class="panel">
  <h3>Project Status</h3>

 <div class="statsColumn">

  <div class="statRow completedStat">
    <span>Completed</span>
    <div id="completedCount">0</div>
  </div>

  <div class="statRow activeStat">
    <span>Remaining</span>
    <div id="activeCount">0</div>
  </div>

  <div class="statRow closedStat">
    <span>Closed</span>
    <div id="closedCount">0</div>
  </div>

</div>


  <div class="progressBar">
    <div id="progressFill"></div>
  </div>

  <div id="progressText" class="progressLabel"></div>
</div>

  </aside>

  <div class="mapWrapper">
    <div id="map"></div>
  </div>
</main>

<div id="confirmModal" class="modal hidden">
  <div class="modalContent">

    <h3>Update Store Status</h3>
    <div id="confirmStoreId" class="modalStoreId"></div>

    <div class="modalAddress">
      <div id="confirmAddressLine"></div>
      <div id="confirmCityLine"></div>
    </div>

    <div class="statusButtons">
      <button id="markActive" class="btnSecondary">Mark Active</button>
      <button id="markCompleted" class="btnPrimary">Mark Completed</button>
      <button id="markClosed" class="btnDanger">Mark Closed</button>
    </div>

    <textarea id="noteBox" placeholder="Leave note (optional)..."></textarea>

    <div class="modalButtons">
      <button id="confirmCancel" class="btnSecondary">Close</button>
    </div>

  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
