<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Import Project Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      --bg: #08111a;
      --panel: #0f1b2a;
      --text: #f6fbff;
      --muted: #9fb0c2;
      --accent: #64b5f6;
      --border: rgba(255,255,255,0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #071019, #0b1521 44%, #0d1826);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .legacyImportNotice {
      width: min(560px, 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 18px 36px rgba(0,0,0,0.22);
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      margin-top: 16px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="legacyImportNotice">
    <h1>Import Project Data has moved</h1>
    <p>The production import workflow now opens inside the main app as the Import Data Shell.</p>
    <p>Redirecting to the current project import workflow...</p>
    <a href="index.html#import">Open Import Project Data</a>
  </main>

  <script>
    (function redirectToImportShell() {
      try {
        window.sessionStorage.setItem("dt:openImportShell", "true");
      } catch (error) {
        console.warn("Import shell redirect intent could not be stored:", error);
      }

      window.setTimeout(function redirect() {
        window.location.replace("index.html#import");
      }, 300);
    })();
  </script>
</body>
</html>
