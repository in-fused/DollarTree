name: Supabase Keepalive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-keepalive.yml
  schedule:
    # Three small project API requests per day. GitHub cron schedules use UTC.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  request-project-api:
    name: Request DollarTreeMap API
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # This is the same browser-safe publishable key used by js/state.js.
      # Never replace it with a service_role or other secret key.
      SUPABASE_URL: https://dapjhrbfqtsgdlasuuam.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7IQ3q8-lQbLw_bXb-zb8OQ_eQMocraT

    steps:
      - name: Perform a minimal project API request
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/settings" \
            --output /dev/null

          echo "DollarTreeMap API responded successfully."
