name: Supabase Keepalive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-keepalive.yml
  schedule:
    # Three small Data API requests per day. GitHub cron schedules use UTC.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  request-data-api:
    name: Request DollarTreeMap Data API
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Browser-safe, low-privilege credentials only.
      # Never replace this with a service_role or other secret key.
      SUPABASE_URL: https://dapjhrbfqtsgdlasuuam.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhcGpocmJmcXRzZ2RsYXN1dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NTkwMjUsImV4cCI6MjA4NjIzNTAyNX0.3UPkOPX233VYvDn-GSoMTPN4m861myr22kVegDcKkC8

    steps:
      - name: Perform a minimal Data API request
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" \
            --output /dev/null

          echo "DollarTreeMap Data API responded successfully."
